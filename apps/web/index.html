<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#F6F2E9" />
    <meta name="color-scheme" content="light dark" />

    <title>Rei das Vendas — Tecnologia e Governança de Resultados</title>
    <meta
      name="description"
      content="Unidade Externa de Tecnologia e Governança de Resultados para empresas que precisam organizar presença, conversão e evolução digital com arquitetura exclusiva."
    />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <link rel="canonical" href="https://reidasvendas.com.br/" />

    <meta name="geo.region" content="BR-SP" />
    <meta name="geo.placename" content="Franca" />
    <meta name="business:contact_data:locality" content="Franca" />
    <meta name="business:contact_data:region" content="SP" />
    <meta name="business:contact_data:country_name" content="Brasil" />

    <!-- Structured data (JSON-LD) inline no HTML inicial => processamento rapido pelo Google
         (recomendado por skill seo-schema: JSON-LD server-rendered evita atraso do JS). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["LocalBusiness", "ProfessionalService"],
          "@id": "https://reidasvendas.com.br/#organization",
          "name": "Rei das Vendas",
          "description": "Unidade Externa de Tecnologia e Governança de Resultados para empresas que precisam organizar presença, conversão e evolução digital com arquitetura exclusiva.",
          "url": "https://reidasvendas.com.br",
          "email": "contato@reidasvendas.com.br",
          "telephone": "+5516992333344",
          "priceRange": "$$",
          "image": "https://reidasvendas.com.br/imagens/og-default.jpg",
          "logo": "https://reidasvendas.com.br/favicon.svg",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Franca",
            "addressRegion": "SP",
            "addressCountry": "BR"
          },
          "areaServed": ["Franca", "Região de Franca", "Brasil"],
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": -20.5389,
            "longitude": -47.4016
          },
          "sameAs": [
            "https://instagram.com/reidasvendas",
            "https://linkedin.com/company/reidasvendas"
          ],
          "founder": {
            "@type": "Person",
            "name": "Thiago B. G. Piola"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://reidasvendas.com.br/#website",
          "url": "https://reidasvendas.com.br",
          "name": "Rei das Vendas",
          "inLanguage": "pt-BR",
          "publisher": { "@id": "https://reidasvendas.com.br/#organization" }
        }
      ]
    }
    </script>

    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rei das Vendas" />
    <meta property="og:title" content="Rei das Vendas — Soberania Digital e Governança de Resultados" />
    <meta
      property="og:description"
      content="Arquitetura, tecnologia e governança para transformar presença digital em uma operação mensurável e orientada ao negócio."
    />
    <meta property="og:url" content="https://reidasvendas.com.br/" />
    <meta property="og:image" content="https://reidasvendas.com.br/imagens/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rei das Vendas — Soberania Digital e Governança de Resultados" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rei das Vendas — Soberania Digital e Governança de Resultados" />
    <meta
      name="twitter:description"
      content="Arquitetura, tecnologia e governança para transformar presença digital em uma operação mensurável e orientada ao negócio."
    />
    <meta name="twitter:image" content="https://reidasvendas.com.br/imagens/og-default.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fontes: preload + swap. Removido @import duplicado do CSS (causava FOUC e dupla carga). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Geist:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Geist:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      />
    </noscript>

    <script>
      (() => {
        const theme = localStorage.getItem('rdv-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0B0D10' : '#F6F2E9');
      })();
    </script>

    <!-- Critical CSS inline: tema aplicado antes do React, sem flash de cor. -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html,body{background:#f6f2e9;color:#102033;margin:0;min-width:320px}
      html[data-theme="dark"],html[data-theme="dark"] body{background:#0b0d10;color:#f4efe5}
      body{font-family:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
      #root{min-height:100dvh}
    </style>
  </head>
  <body>
    <noscript>Este site precisa do JavaScript ativado para exibir as páginas e formulários.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
