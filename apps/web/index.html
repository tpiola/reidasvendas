<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#030303" />
    <meta name="color-scheme" content="dark" />

    <title>Rei das Vendas — Sites profissionais para negócios locais em Franca</title>
    <meta
      name="description"
      content="Criamos sites profissionais para negócios locais e organizamos os pontos essenciais da presença online para facilitar buscas, orçamentos, agendamentos e contatos."
    />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <link rel="canonical" href="https://reidasvendas.com.br/" />

    <meta name="geo.region" content="BR-SP" />
    <meta name="geo.placename" content="Franca" />
    <meta name="business:contact_data:locality" content="Franca" />
    <meta name="business:contact_data:region" content="SP" />
    <meta name="business:contact_data:country_name" content="Brasil" />

    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rei das Vendas" />
    <meta property="og:title" content="Rei das Vendas — Sites profissionais para negócios locais" />
    <meta
      property="og:description"
      content="Sua empresa bem apresentada, fácil de encontrar e pronta para receber novos clientes."
    />
    <meta property="og:url" content="https://reidasvendas.com.br/" />
    <meta property="og:image" content="https://reidasvendas.com.br/imagens/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rei das Vendas — sites profissionais para negócios locais" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rei das Vendas — Sites profissionais para negócios locais" />
    <meta
      name="twitter:description"
      content="Sua empresa bem apresentada, fácil de encontrar e pronta para receber novos clientes."
    />
    <meta name="twitter:image" content="https://reidasvendas.com.br/imagens/og-default.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fontes: preload + swap. Removido @import duplicado do CSS (causava FOUC e dupla carga). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Geist:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Geist:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      />
    </noscript>

    <!-- Critical CSS inline: fundo escuro imediato, sem flash de cor, sem scrollbar shift. -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html,body{background:#030303;color:#f5f5f5;margin:0;min-width:320px}
      body{font-family:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
      #root{min-height:100dvh}
    </style>
  </head>
  <body>
    <noscript>Este site precisa do JavaScript ativado para exibir as páginas e formulários.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
