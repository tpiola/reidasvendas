    <style>
      :root {
        --paper: #07090d;
        --paper-raised: #0d1118;
        --surface: #141923;
        --ink: #f7f3e8;
        --ink-soft: #c0b9aa;
        --muted: #9b9384;
        --rule: #302e28;
        --accent: #e8c86f;
        --accent-strong: #f4e1a5;
        --positive: #22c76a;
        --positive-ink: #06170d;
        --display: "Barlow Condensed", "Arial Narrow", sans-serif;
        --body: "Archivo", "Helvetica Neue", sans-serif;
      }
      *,
      *::before,
      *::after { box-sizing: border-box; }
      html,
      body {
        margin: 0;
        min-width: 320px;
        overflow-x: clip;
        background: var(--paper);
        color: var(--ink);
      }
      body {
        font-family: var(--body);
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100dvh; }

      /* Boot loader — estado de carregamento de marca, NÃO uma página.
         Some quando o React monta (removeBootLoader em main.tsx).
         Mesmo fundo do tema: a transição para o conteúdo é suave. */
      .rdv-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #07090d;
        transition: opacity 420ms ease;
      }
      .rdv-boot.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .rdv-boot__inner {
        display: grid;
        justify-items: center;
        gap: 1rem;
      }
      .rdv-boot__mark {
        display: grid;
        width: 3.4rem;
        height: 3.4rem;
        place-items: center;
        border: 1px solid rgba(232, 200, 111, 0.85);
        color: #f4e1a5;
        font-family: var(--display);
        font-size: 1.55rem;
        line-height: 1;
      }
      .rdv-boot__name {
        color: #f7f3e8;
        font-family: var(--display);
        font-size: 1.45rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        line-height: 1;
      }
      .rdv-boot__bar {
        width: 9rem;
        height: 1px;
        overflow: hidden;
        background: rgba(232, 200, 111, 0.18);
      }
      .rdv-boot__bar::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        background: #e8c86f;
        animation: rdv-boot-slide 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes rdv-boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(245%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rdv-boot__bar::after { animation: none; }
      }

      /* ═══ CSS das páginas internas pré-renderizadas (markup initial-* gerado
         pelo prerender-growth.mjs — NÃO usado na home, que só tem o loader) ═══ */
      .initial-header {
        border-bottom: 1px solid var(--rule);
        background: var(--paper);
      }
      .initial-header__inner {
        width: min(calc(100% - 2rem), 82rem);
        min-height: 4.5rem;
        margin-inline: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
        .initial-header__action {
          font-size: 0.75rem;
        }
        .initial-header__action {
          padding-inline: 0.75rem;
        }
      .initial-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--ink);
        text-decoration: none;
        line-height: 1;
      }
      .initial-brand b {
        display: grid;
        width: 2.5rem;
        height: 2.5rem;
        place-items: center;
        border: 1px solid var(--ink);
        font-family: var(--display);
        font-size: 1.125rem;
      }
      .initial-brand span {
        display: grid;
        gap: 0.25rem;
      }
      .initial-brand strong {
        font-family: var(--display);
        font-size: 1.375rem;
        line-height: 0.9;
      }
      .initial-brand small {
        color: var(--ink-soft);
        font-size: 0.75rem;
        font-weight: 600;
      }
        .initial-brand small {
          display: none;
        }
        .initial-brand strong {
          font-size: 1.125rem;
        }
        .initial-brand b {
          width: 2.25rem;
          height: 2.25rem;
        }
      .initial-home__action {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1rem;
        border: 1px solid var(--positive);
        background: var(--positive);
        color: var(--positive-ink);
        font-size: 0.875rem;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        white-space: nowrap;
      }
      .initial-home {
        min-height: calc(100svh - 4.5rem);
        padding: clamp(3rem, 8vh, 7rem) 1rem;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(10, 22, 40, 0.78), rgba(3, 7, 13, 0.92)),
          url("/videos/hero-signal-poster.webp") center/cover;
        color: #f7f5f2;
        text-align: center;
      }
      .initial-home__grid {
        width: min(100%, 82rem);
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(19rem, 0.8fr);
        align-items: end;
        gap: clamp(2rem, 6vw, 6rem);
        text-align: left;
      }
      .initial-home__kicker {
        margin: 0;
        padding: 0.5rem 0.9rem;
        border: 1px solid rgba(232, 200, 111, 0.28);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.055);
        color: #e8c86f;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        line-height: 1;
        text-transform: uppercase;
      }
      .initial-home h1 {
        max-width: 14ch;
        margin: clamp(1.35rem, 3vh, 2rem) 0 0;
        font-family: var(--display);
        font-size: clamp(3.6rem, 7.4vw, 7rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 0.93;
        text-wrap: balance;
      }
      .initial-home h1 span {
        color: #f4e1a5;
        text-decoration: underline;
        text-decoration-color: #e8c86f;
        text-decoration-thickness: 2px;
        text-underline-offset: 0.1em;
      }
      .initial-home__lead {
        max-width: 48rem;
        margin: clamp(1.5rem, 3vh, 2rem) 0 0;
        color: rgba(247, 245, 242, 0.72);
        font-size: clamp(1rem, 1.6vw, 1.22rem);
        line-height: 1.7;
        text-wrap: balance;
      }
      .initial-home__lead strong {
        color: #f4e1a5;
      }
      .initial-home__actions {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .initial-home__secondary {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(247, 243, 232, 0.25);
        color: #f7f3e8;
        font-size: 0.875rem;
        font-weight: 700;
        text-decoration: none;
      }
        .initial-home {
          padding: 2rem 0.75rem;
        }
        .initial-home__grid {
          grid-template-columns: 1fr;
          align-items: start;
        }
        .initial-home h1 {
          max-width: 13ch;
          font-size: clamp(2.75rem, 13vw, 4.25rem);
          line-height: 0.95;
        }
        .initial-home__lead {
          margin-top: 1.2rem;
          font-size: 0.96rem;
          line-height: 1.55;
        }
      .initial-map {
        padding: 1.5rem;
        border: 1px solid rgba(232, 200, 111, 0.24);
        background: rgba(7, 9, 13, 0.74);
        backdrop-filter: blur(1rem);
      }
      .initial-map__head {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        color: var(--accent);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .initial-map h2 {
        margin: 1rem 0;
        font: 600 1.5rem/1 var(--display);
      }
      .initial-map ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .initial-map li {
        padding: 0.85rem 0;
        border-top: 1px solid rgba(247, 243, 232, 0.12);
      }
      .initial-map p {
        margin: 0;
      }
      .initial-map h3 {
        font-size: 0.9rem;
      }
      .initial-map h3 span {
        margin-right: 0.65rem;
        color: var(--accent);
        font: 600 0.7rem/1 var(--display);
      }
      .initial-map p {
        margin-top: 0.35rem;
        color: var(--ink-soft);
        font-size: 0.75rem;
      }
        .initial-map { display: none; }
      .initial-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }


      @media (max-width: 48rem) {
        .initial-brand small {
          display: none;
        }
        .initial-header__action {
          font-size: 0.75rem;
        }
        .initial-home {
          padding: 2rem 0.75rem;
        }
        .initial-home__grid {
          grid-template-columns: 1fr;
          align-items: start;
        }
        .initial-home h1 {
          max-width: 13ch;
          font-size: clamp(2.75rem, 13vw, 4.25rem);
          line-height: 0.95;
        }
        .initial-home__lead {
          margin-top: 1.2rem;
          font-size: 0.96rem;
          line-height: 1.55;
        }
        .initial-map { display: none; }
      }
      @media (max-width: 23.5rem) {
        .initial-brand strong {
          font-size: 1.125rem;
        }
        .initial-brand b {
          width: 2.25rem;
          height: 2.25rem;
        }
        .initial-header__action {
          padding-inline: 0.75rem;
        }
      }
    </style>
