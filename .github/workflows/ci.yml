name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from "packageManager" in package.json (pnpm@9.15.0)

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log

      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reidasvendas-lint-log
          path: lint.log
          retention-days: 1

      - run: pnpm test

      - name: Build web (necessário para preview/E2E)
        run: pnpm build:web

      - name: Install Playwright Browsers
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm -C apps/web e2e

      - run: pnpm build
