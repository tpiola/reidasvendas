name: Repair lockfile

on:
  push:
    branches: ["claude/clever-heisenberg-duthut"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/clever-heisenberg-duthut
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile --lockfile-only
      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already consistent"
          else
            git commit -m "chore: regenera lockfile após consolidação"
            git push origin HEAD:claude/clever-heisenberg-duthut
          fi
