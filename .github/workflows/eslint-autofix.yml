name: ESLint autofix

on:
  push:
    branches: ["claude/clever-heisenberg-duthut"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/clever-heisenberg-duthut
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply safe ESLint fixes
        run: pnpm -C apps/web exec eslint . --fix || true
      - name: Commit safe fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          if git diff --cached --quiet; then
            echo "No automatic fixes"
          else
            git commit -m "fix: aplica correções automáticas seguras do ESLint"
            git push origin HEAD:claude/clever-heisenberg-duthut
          fi
